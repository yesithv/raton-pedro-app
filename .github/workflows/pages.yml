name: Pages

# Publica el prototipo web. getUserMedia exige HTTPS, así que sin esto no hay forma de
# probarlo en un teléfono.
#
# HACE FALTA UN PASO MANUAL, UNA SOLA VEZ, y no se puede automatizar:
#
#     Settings -> Pages -> Source: "GitHub Actions"
#
# Hasta que se haga, este workflow falla con:
#     Get Pages site failed … Not Found
#
# Y no, no se arregla con "enablement: true" en configure-pages: crear el sitio por API
# exige permiso de administración del repositorio, que GITHUB_TOKEN no tiene.
#
#
# Aviso: si el entorno github-pages tiene reglas de protección de rama (por defecto suele
# limitarse a la rama principal), el despliegue desde una rama de trabajo fallará con un
# error de "environment protection rules". Se arregla en Settings -> Environments ->
# github-pages, permitiendo la rama, o fusionando a main.

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "shaders/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _site/web _site/shaders
          # web/ y shaders/ conservan su posición relativa: la página carga el shader
          # desde ../shaders/, que es lo que evita tener dos copias del mismo archivo.
          cp -r web/* _site/web/
          cp shaders/composite.vert shaders/composite.frag _site/shaders/
          rm -rf _site/web/test
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Ratón Pérez AR</title>
          <meta http-equiv="refresh" content="0; url=web/">
          <p>Redirigiendo a <a href="web/">el prototipo</a>…</p>
          HTML

      # Sin "enablement: true" a propósito: crear el sitio de Pages por API exige permiso
      # de ADMINISTRACIÓN del repositorio, y GITHUB_TOKEN no lo tiene por mucho que el
      # workflow declare pages:write. Con enablement puesto, el error solo cambia de
      # "Not Found" a "Resource not accessible by integration". Comprobado en las dos
      # primeras ejecuciones.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
