name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fijado, no "stable": la verificación local se hizo contra esta versión y un salto de
  # Flutter puede cambiar el Gradle generado sin que nadie toque el repo.
  FLUTTER_VERSION: "3.47.3"

jobs:
  dart:
    name: Dart · analyze y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android:
    name: Android · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Esto es lo que NO se puede comprobar en un entorno sin Google Maven: el Android
      # Gradle Plugin, AndroidX y, sobre todo, la API REAL de ARCore. Si ArCoreDriver.kt
      # se desvía de la API de verdad, falla aquí y en ningún otro sitio.
      - run: flutter build apk --debug
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: perezar-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  emulador:
    name: Android · humo en emulador
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: perezar-debug-apk

      # KVM hace falta para que el emulador no vaya por software, que en un runner es
      # tan lento que todo da timeout.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Qué prueba esto: que la app arranca, no revienta al crear el contexto GL y llega
      # a la primera pantalla. Nada más.
      #
      # Qué NO prueba, y es la mayor parte: un emulador no tiene ARCore, así que se
      # ejercita el camino de Camera2Driver, no el de anclaje. Su cámara falsa no tiene
      # ruido de sensor, así que el SceneAnalyzer mide algo que no existe en la realidad.
      # Y su MediaCodec no es el de un teléfono barato. El rendimiento aquí no dice
      # absolutamente nada sobre gama baja.
      - name: Arrancar y comprobar que no revienta
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb shell pm grant com.ironcoding.perezar android.permission.CAMERA
            adb shell pm grant com.ironcoding.perezar android.permission.RECORD_AUDIO
            adb logcat -c
            adb shell am start -n com.ironcoding.perezar/.MainActivity
            sleep 25
            adb logcat -d > logcat.txt

            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "::error::La app crasheó al arrancar"
              grep -A 30 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            if ! adb shell pidof com.ironcoding.perezar > /dev/null; then
              echo "::error::El proceso no sigue vivo tras 25 s"
              tail -80 logcat.txt
              exit 1
            fi
            echo "arrancó y sigue vivo"
            adb exec-out screencap -p > arranque.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: |
            logcat.txt
            arranque.png
          if-no-files-found: warn

  web:
    name: Web · asistente sobre cámara falsa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/requirements.txt
      - run: npm ci || npm install --no-fund --no-audit
        working-directory: web/test
      - run: npx playwright install --with-deps chromium
        working-directory: web/test

      - name: Cadena de assets
        run: |
          python3 tools/make_placeholder.py --outdir /tmp/ph --effect-frames 45 \
            --room-frames 60 --size 720x1280
          python3 tools/build_effect.py /tmp/ph/frames -o /tmp/ph/efecto.mp4 \
            --track-size 480x848
          python3 tools/compose.py /tmp/ph/cuarto_sintetico.mp4 /tmp/ph/efecto.mp4 \
            -o /tmp/ph/graded.mp4

      - name: Recorrido del asistente
        run: SHOT_DIR=/tmp/shots ./web/test/run.sh
        env:
          WORK_DIR: /tmp/webtest

      # Las capturas son la mitad del valor: dejan ver si la composición se rompió
      # visualmente aunque las aserciones pasen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-asistente
          path: /tmp/shots
          if-no-files-found: warn
