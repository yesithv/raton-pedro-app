name: CI Android

# La app nativa. Corre SOLO cuando cambia algo que puede romperla.
#
# Hasta ahora corría en cada commit, incluidos los de CSS: de los últimos 15 commits del
# repo, NINGUNO tocó app/, y los quince compilaron un APK y arrancaron un Android virtual.
# Dos veces cada uno.
#
# No se quita, se acota. Es lo único que demuestra que el nativo ARRANCA -el 10 de
# septiembre cazó dos fallos reales- y la app no se ha ejecutado nunca en un teléfono de
# verdad, así que sin esto no quedaría ninguna prueba de que la capa nativa funciona.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "shaders/**"
      - "tools/emulator_smoke.sh"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "shaders/**"
      - "tools/emulator_smoke.sh"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fijado, no "stable": la verificación local se hizo contra esta versión y un salto de
  # Flutter puede cambiar el Gradle generado sin que nadie toque el repo.
  FLUTTER_VERSION: "3.47.3"

jobs:
  dart:
    name: Dart · analyze y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android:
    name: Android · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Esto es lo que NO se puede comprobar en un entorno sin Google Maven: el Android
      # Gradle Plugin, AndroidX y, sobre todo, la API REAL de ARCore. Si ArCoreDriver.kt
      # se desvía de la API de verdad, falla aquí y en ningún otro sitio.
      - run: flutter build apk --debug
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: perezar-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  emulador:
    name: Android · humo en emulador
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: perezar-debug-apk

      # KVM hace falta para que el emulador no vaya por software, que en un runner es
      # tan lento que todo da timeout.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # El script vive en tools/ y no aquí: android-emulator-runner ejecuta cada línea
      # de `script:` como un sh -c independiente, así que un if/fi multilínea se parte y
      # falla con "Syntax error", que encima se lee como si hubiera fallado la app.
      - name: Arrancar y comprobar que no revienta
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash tools/emulator_smoke.sh app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: |
            logcat.txt
            arranque.png
          if-no-files-found: warn
