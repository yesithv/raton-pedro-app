<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title data-t="app.titulo">Ratón Pérez AR — prototipo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%AD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
  // En línea y antes de la hoja de estilos a propósito: si el tema guardado se aplicara
  // desde el módulo, la página pintaría primero el tema del sistema y saltaría al otro a
  // la vista del usuario. Un destello blanco a las dos de la mañana no es un detalle.
  try {
    const guardado = localStorage.getItem("tema");
    if (guardado === "claro" || guardado === "oscuro") {
      document.documentElement.dataset.tema = guardado;
    }
    // Y el idioma, por lo mismo pero de otra forma: el <html lang> gobierna el guionado y
    // las comillas del navegador, y los módulos cargan DESPUÉS del primer pintado. Aquí
    // solo el atributo; las palabras las pone `i18n.js` cuando llega.
    const idioma = localStorage.getItem("idioma");
    if (/^(es|en|pt)$/.test(idioma || "")) document.documentElement.lang = idioma;
  } catch (e) { /* sin almacenamiento, manda el sistema */ }
</script>
</head>
<body>

<!-- Los dos iconos de navegación, definidos una sola vez y usados con <use>.
     Van en SVG y no como caracteres de texto (✕, ←) porque un carácter lo dibuja la
     fuente del sistema: se ve distinto en cada teléfono, no siempre existe, y no hay
     forma de darle un grosor de trazo. Era el problema 4 del brief de rediseño.

     LA CONVENCIÓN, y se aplica en toda la app: arriba a la IZQUIERDA se vuelve, arriba a
     la DERECHA se cierra. Siempre en el mismo sitio, para no tener que buscarlo. -->
<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="ic-atras" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 5.5 8 12l6.5 6.5"/>
  </symbol>
  <symbol id="ic-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.1" stroke-linecap="round">
    <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
  </symbol>
</defs></svg>

<canvas id="stage"></canvas>

<video id="camera" playsinline muted autoplay></video>
<video id="overlay" playsinline muted preload="auto"></video>

<!-- Ratón del modo FOTO: PNG con alfa encima de la cámara, sin vídeo ni shader -->
<img id="sticker" src="assets/raton_perez.png" alt="Ratón Pérez" draggable="false" hidden>

<!-- El botón de los AJUSTES. Vive FUERA del arranque, y ese es el arreglo: estaba
     dentro de #boot, que se oculta entero al encender la cámara, así que en cuanto
     empezabas ya no había forma de volver al tema ni al idioma. Ahora es el mismo botón,
     en el mismo sitio -arriba a la derecha-, en las dos pantallas donde se elige con qué
     luz quieres la app: el arranque y el INICIO.

     No aparece en los pasos de la cámara: ahí arriba a la derecha está CERRAR, y la
     convención de las esquinas manda sobre cualquier atajo.

     EL DIBUJO SON DESLIZADORES, y antes era un círculo con ocho rayos: o sea, un SOL. Un
     sol encima de una app que tiene tema claro y tema oscuro no dice "ajustes", dice
     "toca aquí para cambiar a claro" — y el tema es una de las dos cosas que hay dentro,
     no lo que hace el botón. Los deslizadores dicen lo que hay detrás: cosas que se
     eligen.

     Tampoco es una rueda dentada, que sería la otra opción evidente: a 21 px sus dientes
     se empastan en una mancha con el grosor de trazo de esta app. Está medido, no
     supuesto: los deslizadores se leen al tamaño al que se usan de verdad, y la rueda
     solo se lee ampliada.

     El dibujo no cambia con el idioma; el rótulo, sí, y por eso el nombre del botón viene
     de `nav.ajustes` y no escrito aquí. -->
<button id="ajustes-abrir" class="icon" data-t-label="nav.ajustes">
  <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
       stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <!-- Los raíles se CORTAN alrededor de cada mando en vez de pasar por debajo: el hueco
         se dibuja solo, sin tener que rellenar el mando de un color de fondo que luego
         habría que mantener igual en los dos temas. -->
    <path d="M4 6.5h9.3M17.7 6.5H20M4 12h2.3M10.7 12H20M4 17.5h6.8M15.2 17.5H20"/>
    <circle cx="15.5" cy="6.5" r="2.2"/>
    <circle cx="8.5" cy="12" r="2.2"/>
    <circle cx="13" cy="17.5" r="2.2"/>
  </svg>
</button>

<!-- Arranque: permiso de cámara -->
<div id="boot">
  <img id="boot-hero" src="assets/raton_perez.png" alt="">
  <div class="rayas" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1 data-t-html="arranque.titulo"></h1>
  <p data-t="arranque.entradilla"></p>
  <button id="start" data-t="arranque.empezar"></button>
  <p class="fine" data-t="arranque.privacidad"></p>
</div>

<!-- Titular del paso INICIO, sobre la escena -->
<div id="inicio-head" hidden>
  <h2 data-t-html="inicio.titulo"></h2>
  <p data-t="inicio.entradilla"></p>
</div>

<!-- Retículo de colocación (paso ESCANEAR) -->
<div id="reticle" hidden>
  <div class="ring"></div>
  <div class="arrow">↑</div>
</div>

<!-- Cromo permanente -->
<!-- Izquierda se vuelve, derecha se cierra. Antes era al revés -casa a la izquierda y
     flecha a la derecha-, que además dejaba la acción de salir en el sitio de volver. -->
<div id="chrome" hidden>
  <button id="back" class="icon" data-t-title="nav.atras" data-t-aria="nav.atrasAria">
    <svg class="ic" aria-hidden="true"><use href="#ic-atras"/></svg>
  </button>
  <div id="step-title"></div>
  <button id="home" class="icon" data-t-title="nav.cerrar" data-t-aria="nav.cerrarAria">
    <svg class="ic" aria-hidden="true"><use href="#ic-cerrar"/></svg>
  </button>
</div>

<!-- Instrucciones por paso -->
<div id="hint" hidden></div>

<!-- Badge de grabación -->
<div id="rec-badge" hidden><span class="dot"></span><span id="rec-time">0.0s</span></div>

<!-- Barra inferior, cambia por paso -->
<div id="bar" hidden>

  <div id="ui-inicio" class="pane" hidden>
    <!-- El vídeo NO entra en el MVP: la primera versión son la foto y la carta.
         Se queda a la vista, y eso es deliberado: quitarla de golpe haría que quien ya
         conoce la app creyera que se ha roto algo, y además esconde la mitad de lo que el
         producto va a ser. Lo que se va es la PROMESA de que lleva a algún sitio.

         Tres cosas cambian a la vez, y las tres dicen lo mismo desde ángulos distintos:
         el galón de la derecha —que significa "esto te lleva a otra pantalla"— se
         sustituye por una pastilla que dice PRÓXIMAMENTE; el pie deja de anunciar cuánto
         tarda y dice cuándo llega; y `aria-disabled` lo cuenta para quien no ve nada de
         eso. No lleva `disabled` a secas a propósito: un botón deshabilitado de verdad no
         emite el clic, y entonces no habría forma de explicar POR QUÉ no pasa nada, que
         es justo lo que convierte un botón mudo en una app rota. -->
    <button id="go-video" class="card">
      <span class="ic">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 12.2 21 9v6l-5.5-3.2z"/>
        </svg>
      </span>
      <span><b data-t="inicio.video"></b><em data-t="inicio.videoPie"></em></span>
      <!-- Las dos van en el HTML y el CSS enseña la que toca, según la clase `proxima`
           que pone `pintarPuertaVideo()`. Así el estado lo decide UNA constante del
           código y no hay forma de que el atributo y el dibujo digan cosas distintas,
           que es justo lo que pasó al escribirlo a mano: con la puerta abierta, la
           tarjeta seguía anunciándose como deshabilitada. -->
      <span class="chev">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
      </span>
      <span class="insignia" data-t="inicio.proximamente"></span>
    </button>
    <button id="go-photo" class="card">
      <span class="ic">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.2-2h8.2l1.2 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </span>
      <span><b data-t="inicio.foto"></b><em data-t="inicio.fotoPie"></em></span>
      <span class="chev">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
      </span>
    </button>
    <button id="go-cert" class="card">
      <span class="ic">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 3.5h13v17l-6.5-3.2-6.5 3.2z"/><path d="M9 8.5h6M9 12h6"/>
        </svg>
      </span>
      <span><b data-t="inicio.carta"></b><em data-t="inicio.cartaPie"></em></span>
      <span class="chev">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg>
      </span>
    </button>
    <p class="fine" data-t="inicio.silencio"></p>
  </div>

  <div id="ui-escanear" class="pane" hidden>
    <button id="place" class="primary" data-t="asistente.colocar"></button>
  </div>

  <div id="ui-superficie" class="pane" hidden>
    <button id="next-superficie" class="primary" data-t="asistente.siguiente"></button>
  </div>

  <div id="ui-tamano" class="pane" hidden>
    <button id="next-tamano" class="primary" data-t="asistente.siguiente"></button>
  </div>

  <div id="ui-editar" class="pane" hidden>
    <div class="picker">
      <button id="fx-prev" class="icon" data-t-aria="asistente.anterior">‹</button>
      <div id="fx-title"></div>
      <button id="fx-next" class="icon" data-t-aria="asistente.siguiente">›</button>
    </div>
    <button id="select-fx" class="primary" data-t="asistente.seleccionar"></button>
  </div>

  <div id="ui-grabar" class="pane" hidden>
    <button id="torch" class="icon" data-t-label="asistente.linterna">⚡</button>
    <button id="record" class="shutter" data-t-aria="asistente.grabar"><span></span></button>
    <button id="photo" class="icon" data-t-label="asistente.foto">◎</button>
  </div>

  <!-- Las opciones de CÁMARA, y solo dentro de la cámara. En INICIO no se muestra: ahí
       todavía no hay escena que mirar, y una cuadrícula o un deslizador de grano delante
       de tres tarjetas que dicen qué hace la app no significan nada. Lo que sí hay en
       INICIO es el botón de arriba a la derecha, que son los ajustes de la app. -->
  <button id="camopts-bar" class="tiny" data-t="asistente.camara" hidden></button>
</div>

<!-- Paso FOTO: la cámara del teléfono, imitada.
     Las medidas están tomadas de una captura real de la app de Cámara de iOS, no
     escogidas a ojo (pantalla 1170x2532 a x3, o sea 390 css px de ancho):

       - El visor es 4:3 EXACTO: 1170x1560 físicos. Coincide con 1170 * 4/3 al píxel.
       - Las bandas ocupan el 13,5% arriba y el 24,9% abajo, o sea 1 : 1,84.
       - Y NO son negro opaco: son un VELO. Donde el visor marcaba 135 de brillo, la
         banda marcaba 62 — un 46%, o sea negro al ~55% encima de la misma escena. Por eso
         en la cámara del teléfono se sigue viendo la habitación por encima y por debajo
         del recuadro.
       - La cuadrícula cae en los TERCIOS: medida en y=860 y y=1383 de un visor que va de
         342 a 1902; los tercios teóricos son 862 y 1382.
       - El obturador mide 204 físicos = 68 css px.

     La diferencia deliberada es el color del modo activo: ahí la cámara de iOS pone su
     amarillo y aquí va el rojo del chándal. Se imita la FORMA, no la marca de otro. -->
<div id="ui-foto" hidden>

  <div class="cam-banda" id="cam-arriba">
    <button id="foto-salir" class="cam-btn" data-t-aria="camara.salir" data-t-title="nav.volver">
      <svg class="ic grande" aria-hidden="true"><use href="#ic-atras"/></svg>
    </button>
    <div class="cam-grupo">
      <button id="foto-luz" class="cam-btn" data-t-label="camara.luz">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="currentColor" aria-hidden="true">
          <path d="M13.5 2 5 13.2h5.1L9.8 22l8.7-11.4h-5.3z"/>
        </svg>
      </button>
      <button id="sticker-flip" class="cam-btn" data-t-label="camara.girar">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9h14l-3.2-3.2M20 15H6l3.2 3.2"/>
        </svg>
      </button>
      <button id="foto-mas" class="cam-btn" data-t-label="camara.mas">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="currentColor" aria-hidden="true">
          <circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- El visor: el hueco entre las dos bandas. Aquí no se pinta nada, se ve el lienzo. -->
  <div id="visor">
    <div id="rejilla" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="cam-pista"></div>
  </div>

  <div class="cam-banda" id="cam-abajo">
    <!-- La fila del obturador, como en el teléfono: la última foto a un lado y el botón
         de cambiar de cámara AL OTRO, los dos a la altura del disparador y al alcance
         del pulgar. Estaba abajo, junto al carrusel, y desde ahí no se llega sin mover
         la mano. -->
    <div id="cam-disparo">
      <button id="foto-ultima" class="cam-miniatura" hidden data-t-aria="camara.ultima">
        <img alt="">
      </button>
      <button id="snap" class="disparador" data-t-aria="camara.disparar"><span></span></button>
      <button id="flip" class="cam-btn" data-t-label="camara.cambiar">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-13.7-5.1L4 8"/><path d="M4 4v4h4"/>
          <path d="M4 13a8 8 0 0 0 13.7 5.1L20 16"/><path d="M20 20v-4h-4"/>
        </svg>
      </button>
    </div>
    <div id="cam-modos" role="group" data-t-aria="camara.modo">
      <!-- Mismo motivo que la tarjeta del inicio: se ve, pero avisa en vez de llevar. -->
      <button data-modo="video" aria-pressed="false" data-t="camara.modoVideo"></button>
      <button data-modo="foto" aria-pressed="true" data-t="camara.modoFoto"></button>
    </div>
  </div>
</div>

<!-- DOS hojas, y la línea que las separa es dónde estás cuando las abres.
     Antes era una sola con todo dentro, y ahí el tema de la app convivía con el grano
     del compositor, que no tienen nada que ver.

       - AJUSTES son los de la app: se abren desde el arranque, antes de encender la
         cámara, y no hablan de la cámara.
       - OPCIONES DE CÁMARA son las de lo que estás mirando: se abren desde dentro de la
         cámara -el ••• de FOTO y el botón de la barra del asistente- y los deslizadores
         solo sirven viendo la escena mientras se mueven, que es justo dónde estás. -->

<div id="ajustes" class="hoja" hidden>
  <div class="hoja-panel" role="dialog" aria-modal="true" aria-labelledby="ajustes-titulo">
    <div class="hoja-head">
      <h2 class="titulo-hoja" id="ajustes-titulo" data-t="ajustes.titulo"></h2>
      <button id="ajustes-close" class="icon" data-t-aria="ajustes.cerrar" data-t-title="nav.cerrar">
        <svg class="ic" aria-hidden="true"><use href="#ic-cerrar"/></svg>
      </button>
    </div>

    <div id="ajustes-scroll" class="hoja-scroll">
      <section class="grupo">
        <h3 data-t="ajustes.tema"></h3>
        <div id="tema" class="segmento" role="group" data-t-aria="ajustes.tema"></div>
        <p class="fine texto-hoja" id="tema-pie"></p>
      </section>

      <!-- El idioma cambia la app ENTERA y al momento: la interfaz, los avisos y la
           carta que se imprime. Sin recargar, porque este selector se toca estando ya
           dentro y una recarga perdería lo que hubiera a medias. El pie lo confirma en el
           idioma recién elegido, que es la única prueba que el usuario necesita. -->
      <section class="grupo">
        <h3 data-t="ajustes.idioma"></h3>
        <div id="idioma" class="segmento" role="group" data-t-aria="ajustes.idioma"></div>
        <p class="fine texto-hoja" id="idioma-pie"></p>
      </section>
    </div>

    <div class="hoja-pie">
      <button id="ajustes-listo" class="primary" data-t="ajustes.listo"></button>
    </div>
  </div>
</div>

<div id="camopts" class="hoja" hidden>
  <div class="hoja-panel" role="dialog" aria-modal="true" aria-labelledby="camopts-titulo">
    <div class="hoja-head">
      <h2 class="titulo-hoja" id="camopts-titulo" data-t="opciones.titulo"></h2>
      <button id="camopts-close" class="icon" data-t-aria="opciones.cerrar" data-t-title="nav.cerrar">
        <svg class="ic" aria-hidden="true"><use href="#ic-cerrar"/></svg>
      </button>
    </div>

    <div id="camopts-scroll" class="hoja-scroll">
      <!-- QUIÉN sale en la foto, y va lo primero: es lo único de esta hoja que cambia lo
           que se ve en la foto y no cómo se ve. Los deslizadores de debajo afinan una
           escena; esto elige al personaje.

           Está AQUÍ y no en los ajustes de la app a propósito: se abre con el ••• del
           paso FOTO, o sea con la cámara encendida y el ratón a la vista, así que al
           tocar una miniatura el cambio se ve al momento sobre el visor. En los ajustes
           -que se abren desde el arranque, antes de encender nada- se elegiría a ciegas.

           Se esconde fuera del paso FOTO, que es el único donde hace algo: esta misma
           hoja se abre también desde el asistente de vídeo, y allí el ratón lo pone la
           animación. Un control que no hace nada donde está es peor que no tenerlo. -->
      <section class="grupo" id="raton-grupo">
        <h3 data-t="opciones.raton"></h3>
        <div id="ratones" class="ratones" role="group" data-t-aria="opciones.raton"></div>
        <p class="fine texto-hoja" id="raton-pie" data-t="opciones.ratonPie"></p>
      </section>

      <section class="grupo">
        <label class="fila">
          <span>
            <b data-t="opciones.rejilla"></b>
            <em data-t="opciones.rejillaPie"></em>
          </span>
          <input id="s-rejilla" type="checkbox" checked>
        </label>
        <label class="fila">
          <span>
            <b data-t="opciones.mic"></b>
            <em data-t="opciones.micPie"></em>
          </span>
          <input id="s-mic" type="checkbox" checked>
        </label>
      </section>

      <!-- Doblado, no escondido. Quien lo abra tiene que poder deshacerlo, y por eso
           "Restablecer" está dentro y no en otra pantalla. -->
      <details id="avanzado" class="grupo">
        <summary data-t="opciones.avanzado"></summary>

        <p class="fine texto-hoja" data-t-html="opciones.avanzadoPie"></p>

        <label><span data-t="opciones.key"></span><output id="s-key-v"></output><input id="s-key" type="range" min="0.5" max="2" step="0.01"></label>
        <label><span data-t="opciones.wb"></span><output id="s-wb-v"></output><input id="s-wb" type="range" min="0" max="1" step="0.01"></label>
        <label><span data-t="opciones.expMin"></span><output id="s-exp-min-v"></output><input id="s-exp-min" type="range" min="0.1" max="1.5" step="0.01"></label>
        <label><span data-t="opciones.expMax"></span><output id="s-exp-max-v"></output><input id="s-exp-max" type="range" min="0.5" max="2.5" step="0.01"></label>
        <label><span data-t="opciones.softness"></span><output id="s-softness-v"></output><input id="s-softness" type="range" min="0" max="2.5" step="0.05"></label>
        <label><span data-t="opciones.grainMax"></span><output id="s-grain-max-v"></output><input id="s-grain-max" type="range" min="0" max="0.2" step="0.005"></label>

        <label class="fila">
          <span>
            <b data-t="opciones.limitado"></b>
            <em data-t="opciones.limitadoPie"></em>
          </span>
          <input id="s-limited" type="checkbox">
        </label>

        <div id="clamp-warn" hidden></div>
        <button id="ajustes-reset" data-t="opciones.restablecer"></button>
      </details>

      <!-- Diagnóstico: números crudos, para quien desarrolla. Se abre con ?dev=1 o con
           siete toques en el título de esta hoja. -->
      <section class="grupo" id="diagnostico" hidden>
        <h3 data-t="opciones.diagnostico"></h3>
        <div id="dbg"></div>
      </section>
    </div>

    <div class="hoja-pie">
      <button id="camopts-listo" class="primary" data-t="opciones.listo"></button>
    </div>
  </div>
</div>

<!-- Resultado: video -->
<div id="clip" hidden>
  <button id="clip-close" class="icon esquina-cerrar" data-t-aria="resultado.cerrarVideo" data-t-title="nav.cerrar">
    <svg class="ic" aria-hidden="true"><use href="#ic-cerrar"/></svg>
  </button>
  <video id="clip-video" controls playsinline></video>
  <div id="clip-meta"></div>
  <div class="actions">
    <button id="clip-share" hidden class="primary" data-t="resultado.guardarCarrete"></button>
    <a id="clip-save" class="btn" download="raton-perez.webm" data-t="resultado.descargarArchivo"></a>
  </div>
  <div id="clip-tip" class="tip"></div>
</div>

<!-- Resultado: foto -->
<div id="shot" hidden>
  <button id="shot-close" class="icon esquina-cerrar" data-t-aria="resultado.cerrarFoto" data-t-title="nav.cerrar">
    <svg class="ic" aria-hidden="true"><use href="#ic-cerrar"/></svg>
  </button>
  <img id="shot-img" data-t-alt="resultado.altFoto" alt="">
  <div class="actions">
    <button id="shot-share" hidden class="primary" data-t="resultado.guardarFotos"></button>
    <a id="shot-save" class="btn" download="raton-perez.png" data-t="resultado.descargarArchivo"></a>
  </div>
  <div id="shot-tip" class="tip"></div>
</div>

<!-- La carta del Ratón: primero los datos, y la carta al final -->
<div id="cert" data-paso="datos" hidden>
  <!-- La barra de navegación, FIJA y con UN SOLO botón: volver.
       La X se ha ido. Volver ya sale de aquí -de la carta a los datos, y de los datos al
       inicio-, así que la X era un segundo camino a la misma puerta: dos botones pegados
       en la misma barra que acaban en el mismo sitio obligan a pararse a elegir entre dos
       cosas que no se diferencian en nada.

       La convención sigue en pie: izquierda se vuelve, derecha se cierra. Lo que dice es
       DÓNDE va cada cosa cuando está, no que tengan que estar las dos; y el hueco de la
       derecha se queda vacío a propósito, para que el rótulo no se descentre y para que
       nada más ocupe el sitio de cerrar.

       Y es una FILA de la rejilla y no algo superpuesto: así el formulario empieza debajo
       de la barra por construcción, sin reservarle hueco a mano con un padding que hay que
       acordarse de cuadrar. -->
  <div class="barra-nav">
    <button id="cert-volver" class="icon" data-t-label="nav.volver">
      <svg class="ic" aria-hidden="true"><use href="#ic-atras"/></svg>
    </button>
    <!-- El rótulo cambia de paso llevando su CLAVE, no su texto (`dataset.t`): así el
         repaso del documento al cambiar de idioma lo traduce solo, sin que pasoCert()
         tenga que acordarse de nada. -->
    <div class="barra-nav-titulo" id="cert-paso-titulo" data-t="carta.pasoDatos"></div>
    <div class="barra-nav-hueco" aria-hidden="true"></div>
  </div>

  <div id="cert-scroll">

    <!-- Paso 1: los datos -->
    <div id="cert-datos" class="cert-columna">
      <h2 class="titulo-hoja" data-t="carta.titulo"></h2>
      <p class="fine texto-hoja" data-t="carta.entradilla"></p>

      <div id="cert-form">
        <!-- El rótulo va en un <span> DENTRO del <span> del campo, y no suelto, porque
             `data-t` escribe el elemento entero: con el texto pegado al <i> o al
             <output>, traducir se llevaría por delante al hermano. -->
        <label class="field">
          <span><span data-t="carta.nombre"></span> <i data-t="carta.obligatorio"></i></span>
          <input id="cert-nombre" type="text" autocomplete="off" required
                 enterkeyhint="done" data-t-placeholder="carta.nombrePlaceholder">
          <span class="ayuda aviso" id="cert-nombre-aviso" hidden
                data-t="carta.nombreAviso"></span>
        </label>

        <label class="field">
          <span data-t="carta.fecha"></span>
          <input id="cert-fecha" type="date" required>
          <span class="ayuda" data-t="carta.fechaAyuda"></span>
        </label>

        <div class="field">
          <span data-t="carta.queDiente"></span>
          <div id="cert-diente" class="chips" role="group" data-t-aria="carta.queDiente"></div>
        </div>

        <div class="field">
          <span data-t="carta.comoEstaba"></span>
          <div id="cert-estado" class="chips" role="group" data-t-aria="carta.comoEstaba"></div>
        </div>

        <label class="field">
          <span><span data-t="carta.premio"></span> <i data-t="carta.opcional"></i></span>
          <input id="cert-premio" type="text" autocomplete="off"
                 data-t-placeholder="carta.premioPlaceholder">
          <span class="ayuda"><span data-t="carta.premioAyuda"></span>
            <output id="cert-premio-cuenta"></output></span>
        </label>

        <!-- Textarea y no input: son varias frases, y en una línea de una sola altura no
             se puede releer lo que se acaba de escribir. El maxlength lo pone el módulo
             desde LIMITES.nota, que es quien sabe cuánto cabe en el papel. -->
        <label class="field">
          <span><span data-t="carta.nota"></span> <i data-t="carta.opcional"></i></span>
          <textarea id="cert-nota" rows="4" autocomplete="off"
                    data-t-placeholder="carta.notaPlaceholder"></textarea>
          <span class="ayuda"><span data-t="carta.notaAyuda"></span>
            <output id="cert-nota-cuenta"></output></span>
        </label>
      </div>
    </div>

    <!-- Paso 2: el documento -->
    <div id="cert-doc" class="cert-columna">
      <h2 class="titulo-hoja" id="cert-doc-titulo" data-t="carta.hecha"></h2>
      <p class="fine texto-hoja" data-t="carta.hechaPie"></p>
      <div id="cert-preview">
        <canvas id="cert-canvas" data-t-aria="carta.lienzo"></canvas>
      </div>
    </div>
  </div>

  <!-- La banda de abajo llega de borde a borde -el degradado tiene que tapar el texto que
       pasa por debajo- pero los botones van en la MISMA columna que el formulario, para
       que el borde del botón caiga donde cae el borde de los campos. -->
  <div id="cert-actions">
    <div class="cert-columna">
      <!-- Paso 1 -->
      <button id="cert-generar" class="primary" data-t="carta.generar"></button>

      <!-- Paso 2 -->
      <button id="cert-share" hidden class="primary" data-t="resultado.guardarFotos"></button>
      <div class="actions" id="cert-acciones-doc">
        <button id="cert-print" class="btn" data-t="carta.imprimir"></button>
        <a id="cert-save" class="btn" download="carta-del-raton-perez.png"
           data-t="carta.descargar"></a>
      </div>
      <div id="cert-tip" class="tip"></div>
    </div>
  </div>
</div>

<!-- Los dos avisos de la app, y los dos se ANUNCIAN. Sin `role`, un lector de pantalla
     no dice ni "no hay cámara frontal" ni por qué no arrancó la cámara: el texto aparece
     en pantalla y para quien no la ve no ha pasado nada.
     Y no llevan el mismo: el toast confirma algo que acaba de hacer el usuario y espera
     su turno (`status`); el error interrumpe lo que estuviera leyendo (`alert`), que es
     lo que corresponde a algo que ha impedido seguir. -->
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="error" role="alert" aria-live="assertive" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
